services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paloma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paloma}
      POSTGRES_DB: ${POSTGRES_DB:-paloma_mensajera}
    volumes:
      - paloma_mensajera_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paloma} -d ${POSTGRES_DB:-paloma_mensajera}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    expose:
      - "1025"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # PostgreSQL es el motor principal. Se sobreescribe DATABASE_URL para
      # apuntar al servicio "postgres" de esta red de Docker (no localhost).
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://${POSTGRES_USER:-paloma}:${POSTGRES_PASSWORD:-paloma}@postgres:5432/${POSTGRES_DB:-paloma_mensajera}?schema=public
      # Si SMTP_HOST esta vacio, Compose usa Mailpit local. Si se define
      # smtp.gmail.com (u otro proveedor) en .env, se respetan esos valores.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      # Persiste las imagenes subidas en modo IMAGE_STORAGE_PROVIDER=LOCAL_FILESYSTEM
      # (seccion 9 del SDD) - de lo contrario se perderian en cada reinicio del contenedor.
      - paloma_mensajera_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

volumes:
  paloma_mensajera_postgres_data:
  paloma_mensajera_uploads:
